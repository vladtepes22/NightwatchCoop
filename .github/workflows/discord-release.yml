name: Discord release notice

# Posts every published release to Discord: pre-releases to the beta channel, the rest to the
# stable one. The webhook URLs are repository secrets (DISCORD_WEBHOOK_BETA, DISCORD_WEBHOOK_STABLE).
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ github.event.release.prerelease && secrets.DISCORD_WEBHOOK_BETA || secrets.DISCORD_WEBHOOK_STABLE }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TITLE: ${{ github.event.release.name || github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret for this channel"; exit 0; fi
          jq -n --arg title "$TITLE" --arg url "$URL" --arg body "$BODY" --arg pre "$PRERELEASE" '{
            username: "Nightwatch Co-op",
            embeds: [{
              title: $title,
              url: $url,
              description: (($body | .[0:3800]) + "\n\n[Download](" + $url + ")"),
              color: (if $pre == "true" then 15105570 else 10038562 end),
              footer: { text: (if $pre == "true" then "Beta: see the known issues" else "Stable release" end) }
            }]
          }' | curl -sSf -H "Content-Type: application/json" -d @- "$WEBHOOK"
